name: Pruebas del kit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pip-audit
      - run: python -m pytest -q
      - run: python -m kit.verificar
      - run: python -m kit.medir
      - run: python -m kit.medir
        env:
          KIT_DATOS: respaldo/dane
      - run: python -m kit.medir
        env:
          KIT_DATOS: casos/presupuesto
      - run: python -m kit.medir
        env:
          KIT_DATOS: casos/cafe
      - run: python -m seguridad.pentest
